plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orynion.runaway'
    compileSdk 36

    defaultConfig {
        applicationId "com.orynion.runaway"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    // Pure native Android with OpenGL ES 2.0 and native Canvas HUD
}

